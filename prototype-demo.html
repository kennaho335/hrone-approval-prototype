<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HRONE 审批原型演示</title>
  <style>
    * { box-sizing:border-box; }
    html, body { height:100%; }
    body { margin:0; color:#24324b; background:#eef1f5; font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif; }
    .shell { display:grid; grid-template-columns:220px minmax(0,1fr); grid-template-rows:46px minmax(0,1fr); height:100vh; min-width:760px; }
    .top { grid-column:1 / -1; display:flex; align-items:center; padding:0 18px; background:#f8f9fb; border-bottom:1px solid #d9dfe8; font-size:15px; font-weight:600; }
    .tree { grid-column:1; grid-row:2; min-height:0; margin:8px 0 8px 8px; overflow:auto; background:#fff; border:1px solid #d9dfe8; box-shadow:2px 0 8px rgba(30,48,75,.08); }
    .tree-title { padding:18px 18px 10px; color:#737f92; font-size:12px; }
    .branch { margin:0; padding:0 8px 14px; list-style:none; }
    .group { margin:0; }
    .group-toggle { width:100%; display:flex; align-items:center; justify-content:space-between; padding:10px 10px 6px; border:0; color:#24324b; background:transparent; text-align:left; font:inherit; font-weight:600; cursor:pointer; }
    .group-toggle:hover,.group-toggle:focus-visible { color:#1677ff; outline:none; }
    .group-chevron { color:#73839a; font-size:13px; }
    .subtree { margin:0; padding:0; list-style:none; }
    .subtree[hidden] { display:none; }
    .leaf { margin:2px 0; }
    .page-link { display:block; width:100%; padding:9px 10px 9px 25px; border:0; border-radius:4px; background:transparent; color:#42516b; text-align:left; font:inherit; cursor:pointer; }
    .page-link:hover, .page-link:focus-visible { background:#f0f5ff; outline:none; }
    .page-link.active { color:#1677ff; background:#e9f2ff; font-weight:600; }
    .page-link::before { content:"▤"; margin-right:8px; color:#8a9bb4; }
    .page-link.active::before { color:#1677ff; }
    .root-page-link { padding-left:10px; color:#24324b; font-weight:600; }
    .root-page-link::before { content:none; }
    .root-page { margin-bottom:8px; }
    .root-page .subtree { padding-left:12px; }
    .stage { grid-column:2; grid-row:2; min-width:0; min-height:0; padding:8px; }
    iframe { display:block; width:100%; height:100%; border:1px solid #d9dfe8; background:#fff; }
  </style>
</head>
<body>
  <div class="shell">
    <header class="top">HRONE · 审批原型演示</header>
    <nav class="tree" aria-label="原型页面树">
      <div class="tree-title">页面树</div>
      <ul class="branch">
        <li class="leaf root-page"><button class="page-link root-page-link" data-page="feishuTodo" type="button">飞书HRONE待办</button>
          <ul class="subtree"><li class="leaf"><button class="page-link" data-page="feishuTodoDetail" type="button">待办审批详情页</button></li></ul>
        </li>
        <li class="group"><button class="group-toggle" type="button" aria-expanded="true" aria-controls="flowPages">流程查询<span class="group-chevron" aria-hidden="true">⌃</span></button>
          <ul class="subtree" id="flowPages"><li class="leaf"><button class="page-link" data-page="allProcesses" type="button">全部流程</button></li><li class="leaf"><button class="page-link" data-page="flowApprovalDetail" type="button">流程异常审批详情页</button></li><li class="leaf"><button class="page-link" data-page="processStatusLabel" type="button">流程状态标签</button></li></ul>
        </li>
        <li class="leaf"><button class="page-link" data-page="void" type="button">作废</button></li>
        <li class="group"><button class="group-toggle" type="button" aria-expanded="true" aria-controls="operationPages">审批操作<span class="group-chevron" aria-hidden="true">⌃</span></button>
          <ul class="subtree" id="operationPages"><li class="leaf"><button class="page-link" data-page="operation" type="button">审批操作</button></li></ul>
        </li>
        <li class="group"><button class="group-toggle" type="button" aria-expanded="true" aria-controls="signPages">加签<span class="group-chevron" aria-hidden="true">⌃</span></button>
          <ul class="subtree" id="signPages">
            <li class="leaf"><button class="page-link active" data-page="base" type="button" aria-current="page">原审批人详情页</button></li>
            <li class="leaf"><button class="page-link" data-page="original" type="button">原审批人详情页（前加签）</button></li>
            <li class="leaf"><button class="page-link" data-page="signer" type="button">被加签人审批详情页（前加签）</button></li>
            <li class="leaf"><button class="page-link" data-page="approved" type="button">审批通过详情页（前加签）</button></li>
            <li class="leaf"><button class="page-link" data-page="after" type="button">原审批人详情页（后加签）</button></li>
            <li class="leaf"><button class="page-link" data-page="signerAfter" type="button">被加签人审批详情页（后加签）</button></li>
            <li class="leaf"><button class="page-link" data-page="approvedAfter" type="button">审批通过详情页（后加签）</button></li>
          </ul>
        </li>
      </ul>
    </nav>
    <main class="stage"><iframe id="pageFrame" title="原型页面" src="approval-detail-original.html"></iframe></main>
  </div>
  <script>
    const frame = document.getElementById('pageFrame');
    const setGroupExpanded = (button,expanded) => {
      document.getElementById(button.getAttribute('aria-controls')).hidden = !expanded;
      button.setAttribute('aria-expanded',String(expanded));
      button.querySelector('.group-chevron').textContent = expanded ? '⌃' : '⌄';
    };
    document.querySelectorAll('.group-toggle').forEach(button => button.addEventListener('click',()=>setGroupExpanded(button,button.getAttribute('aria-expanded') !== 'true')));
    const links = [...document.querySelectorAll('.page-link')];
    const pages = {
      allProcesses:'all-processes.html?v=20261021-node-id-v6',
      flowApprovalDetail:'approval-detail-flow.html?v=20261015-anomaly-time',
      processStatusLabel:'process-status-label.html?v=20261019-status-filter',
      void:'void.html',
      feishuTodo:'feishu-hrone-todo.html?v=20261015-approval-cards-v5',
      feishuTodoDetail:'feishu-todo-approval-detail.html',
      home:'hrone-home.html',
      operation:'approval-operation.html?v=20261021-process-config',
      processConfig:'process-config.html?v=20261021-process-config-edit-modal-v5',
      base:'approval-detail-original.html',
      original:'approval-detail.html?v=20261026-validation-toast-v9',
      after:'approval-detail-after.html?v=20261026-validation-toast-v7',
      signer:'approval-detail-signer.html?v=20261026-validation-toast-v7',
      signerAfter:'approval-detail-signer-after.html?v=20261026-validation-toast-v7',
      approved:'approval-detail-approved.html?v=20261026-validation-toast-v7',
      approvedAfter:'approval-detail-approved-after.html?v=20261026-validation-toast-v7'
    };
    let frontTarget = pages.original;
    let afterTarget = pages.after;
    let signerTarget = pages.signer;
    let signerAfterTarget = pages.signerAfter;
    let approvedAfterTarget = pages.approvedAfter;
    const activatePage = page => {
      links.forEach(link => {
        const active = link.dataset.page === page;
        link.classList.toggle('active',active);
        if (active) link.setAttribute('aria-current','page');
        else link.removeAttribute('aria-current');
        if (active) {
          const group = link.closest('.group');
          if (group) setGroupExpanded(group.querySelector('.group-toggle'),true);
        }
      });
    };
    const openPage = (page, target = page === 'approvedAfter' ? approvedAfterTarget : page === 'signerAfter' ? signerAfterTarget : page === 'signer' ? signerTarget : page === 'after' ? afterTarget : page === 'original' ? frontTarget : pages[page]) => {
      activatePage(page);
      frame.src = target;
    };
    links.forEach(link => link.addEventListener('click',()=>openPage(link.dataset.page)));
    window.addEventListener('message',event => {
      if (event.source !== frame.contentWindow || !event.data || typeof event.data !== 'object') return;
      if (event.data.type === 'hrone-open-my-application') {
        openPage('void');
      } else if (event.data.type === 'hrone-open-home') {
        openPage('home');
      } else if (event.data.type === 'hrone-open-feishu-todo-detail') {
        openPage('feishuTodoDetail');
      } else if (event.data.type === 'hrone-open-flow-approval-detail') {
        openPage('flowApprovalDetail');
      } else if (event.data.type === 'hrone-open-process-config') {
        openPage('processConfig');
      } else if (event.data.type === 'hrone-open-all-processes') {
        openPage('allProcesses');
      } else if (event.data.type === 'hrone-open-front' || event.data.type === 'hrone-front-sign') {
        const front = new URL(pages.original,location.href);
        front.searchParams.set('signTime',event.data.signTime);
        front.searchParams.set('signers',JSON.stringify(event.data.signers));
        frontTarget = front.href;
        const target = new URL(pages.signer,location.href);
        target.searchParams.set('signTime',event.data.signTime);
        target.searchParams.set('signers',JSON.stringify(event.data.signers));
        signerTarget = target.href;
        if (event.data.type === 'hrone-open-front') activatePage('original');
      } else if (event.data.type === 'hrone-open-after' || event.data.type === 'hrone-after-sign') {
        const target = new URL(pages.after,location.href);
        target.searchParams.set('signTime',event.data.signTime);
        target.searchParams.set('signers',JSON.stringify(event.data.signers));
        afterTarget = target.href;
        if (event.data.type === 'hrone-open-after') activatePage('after');
      } else if (event.data.type === 'hrone-front-sign-recalled') {
        frontTarget = pages.original;
        signerTarget = pages.signer;
        openPage('base');
      } else if (event.data.type === 'hrone-after-sign-recalled') {
        afterTarget = pages.after;
        openPage('base');
      } else if (event.data.type === 'hrone-open-signer') {
        if (event.data.mode === 'after') {
          signerAfterTarget = event.data.target;
          activatePage('signerAfter');
        } else {
          signerTarget = event.data.target;
          activatePage('signer');
        }
      } else if (event.data.type === 'hrone-signer-rejected') {
        signerTarget = pages.signer;
        signerAfterTarget = pages.signerAfter;
        openPage('base');
      } else if (event.data.type === 'hrone-open-approved') {
        if (event.data.mode === 'after') {
          approvedAfterTarget = event.data.target || pages.approvedAfter;
          activatePage('approvedAfter');
        } else activatePage('approved');
      }
    });
  </script>
</body>
</html>
