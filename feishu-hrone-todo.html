<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>飞书HRONE待办</title>
  <style>
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{font:14px -apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif;color:#1c293a;background:#f5f6fa}
    button{font:inherit;cursor:pointer}
    .app{display:grid;grid-template-columns:225px 275px 420px minmax(0,1fr);grid-template-rows:45px minmax(0,1fr);height:100vh;min-width:900px;min-height:480px;overflow:hidden}
    .rail{grid-column:1;grid-row:1/3;display:flex;flex-direction:column;min-height:0;padding:22px 10px 0;background:linear-gradient(110deg,#dfeafd,#edf1ff 58%,#fff);border-right:1px solid #e1e5ed}
    .global-search{display:flex;align-items:center;gap:9px;height:40px;padding:0 14px;color:#5f6b7d;background:#e3ebf6;border:1px solid #cbd4df;border-radius:11px;white-space:nowrap}
    .global-search b{font-size:20px;font-weight:400}
    .rail-list{min-height:0;overflow:auto;padding-top:11px}
    .rail-item{display:flex;align-items:center;gap:11px;min-height:45px;padding:0 14px;color:#5f6873;white-space:nowrap}
    .rail-icon{width:19px;text-align:center;color:#8c96a2;font-size:17px}
    .rail-bottom{margin-top:auto;padding-bottom:9px}
    .rail-item.selected{background:#fff;border-radius:11px;color:#1c293a}
    .rail-item.selected .rail-icon{color:#246dff}
    .topbar{grid-column:2/5;grid-row:1;display:flex;justify-content:space-between;min-width:0;background:#fff;border-bottom:1px solid #dce1e8}
    .tabs{display:flex;align-items:stretch;gap:29px;padding:0 20px;white-space:nowrap}
    .tab{display:flex;align-items:center;position:relative;font-size:18px}
    .tab.active{color:#286dff}
    .tab.active:after{content:"";position:absolute;bottom:0;left:0;right:0;height:3px;background:#3975ff;border-radius:4px 4px 0 0}
    .top-tools{display:flex;align-items:center;gap:21px;padding:0 27px;color:#4e5969;white-space:nowrap}
    .top-tools i{font-style:normal;color:#6c7889;font-size:19px}
    .sidebar{grid-column:2;grid-row:2;display:flex;flex-direction:column;min-width:0;min-height:0;background:#fff;border-right:1px solid #dfe3eb}
    .side-search{display:flex;align-items:center;height:40px;margin:10px 10px 9px;padding:0 13px;color:#98a5b5;border:1px solid #d2d9e4;border-radius:9px}
    .side-search span{flex:1}
    .side-scroll{flex:1;min-height:0;overflow:auto;padding:0 9px}
    .nav-heading{display:flex;align-items:center;gap:8px;min-height:50px;padding:0 11px;border-radius:10px;background:#e5ecff;color:#286dff;font-size:16px}
    .nav-heading strong{flex:1;font-weight:500}
    .count{margin-left:auto;color:#5d6d82}
    .nav-heading .count{color:#286dff}
    .nav-row{display:flex;align-items:center;min-height:50px;padding:0 18px;font-size:16px}
    .nav-row.child{padding-left:52px}
    .nav-row.grandchild{min-height:42px;margin:0 1px 0 36px;padding-left:16px;border-radius:8px;font-size:14px}
    .nav-row.current{background:#edf2ff;color:#286dff;font-weight:600}
    .nav-row.section{gap:9px}
    .section-toggle{width:100%;border:0;background:#fff;text-align:left;color:inherit}
    .section-toggle[aria-expanded="true"]{background:#f1f1f1;border-radius:8px}
    .section-toggle .chevron{width:12px}
    .section-pages[hidden]{display:none}
    .section-pages .nav-row{min-height:45px;padding-left:47px;font-size:14px}
    .side-footer{height:58px;flex:none;padding:17px 23px;border-top:1px solid #e1e5ec;font-size:16px}
    .list-pane{grid-column:3;grid-row:2;display:flex;flex-direction:column;min-width:0;min-height:0;background:#f7f8fb;border-right:1px solid #e1e5ed}
    .list-head{display:flex;align-items:center;justify-content:space-between;flex:none;height:59px;padding:0 15px;font-size:16px}
    .list-head span:last-child{color:#758194;font-size:20px}
    .cards{flex:1;min-height:0;overflow:auto;padding:0 10px 10px;scrollbar-width:thin;scrollbar-color:#d9dee7 transparent}
    .task-card{display:block;width:100%;min-height:95px;margin:0 0 10px;padding:13px 15px;text-align:left;color:#495568;background:#fff;border:1px solid #dadee5;border-radius:10px}
    .task-card.selected{border-color:#3973ff;box-shadow:0 0 0 1px #3973ff inset}
    .task-card:hover{border-color:#8eacff}
    .card-title{min-height:43px;line-height:21px;color:#26374d;font-size:14px}
    .card-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:9px;font-size:12px}
    .originator{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#68788f}
    .due{margin-left:auto;color:#f87900;white-space:nowrap}
    .due.muted{color:#71809a}
    .detail-wrap{grid-column:4;grid-row:2;min-width:0;min-height:0;padding:10px 16px 9px 0}
    .detail{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;background:#fff;border:1px solid #dfe4eb;border-radius:8px}
    .empty-art{display:block;width:160px;height:150px;margin-bottom:5px}
    .empty-note{margin:0 0 19px;color:#607493;font-size:18px;white-space:nowrap}
    .open-button{min-height:41px;padding:0 16px;color:#fff;background:#3973ff;border:0;border-radius:6px;font-size:17px;white-space:nowrap}
    .open-button:hover{background:#2661ed}
    @media(max-width:1500px){.app{grid-template-columns:175px 225px 340px minmax(0,1fr)}.tabs{gap:18px;padding:0 13px}.tab{font-size:15px}.top-tools{gap:12px;padding-right:14px;font-size:12px}.rail-item{font-size:13px}.nav-heading,.nav-row{font-size:14px}.nav-row.child{padding-left:42px}.nav-row.grandchild{margin-left:34px;padding-left:8px}}
    @media(max-width:1100px){.app{grid-template-columns:132px 190px 300px minmax(278px,1fr)}.rail{padding:10px 6px 0}.global-search{padding:0 8px;font-size:11px}.rail-item{gap:5px;padding:0 6px;font-size:12px}.rail-icon{width:16px;font-size:15px}.tabs{gap:11px;padding:0 10px}.tab{font-size:13px}.top-tools{gap:8px;padding-right:7px;font-size:10px}.top-tools i{font-size:14px}.nav-heading,.nav-row{font-size:13px}.nav-row.child{padding-left:30px}.nav-row.grandchild{margin-left:22px;padding-left:8px;font-size:12px}.section-pages .nav-row{padding-left:34px;font-size:12px}.list-head{font-size:13px}.card-title{font-size:12px;line-height:19px}.card-bottom{font-size:10px}.empty-art{width:120px;height:113px}.empty-note,.open-button{font-size:13px}}
  </style>
</head>
<body>
  <main class="app" aria-label="飞书HRONE待办页面原型">
    <aside class="rail" aria-label="飞书应用导航">
      <div class="global-search"><b>⌕</b>搜索 (Ctrl + K)</div>
      <div class="rail-list">
        <div class="rail-item"><span class="rail-icon">●</span>消息</div>
        <div class="rail-item"><span class="rail-icon">◉</span>豆包工作</div>
        <div class="rail-item"><span class="rail-icon">✉</span>邮箱</div>
        <div class="rail-item"><span class="rail-icon">▦</span>工作台</div>
        <div class="rail-item"><span class="rail-icon">▣</span>视频会议</div>
        <div class="rail-item"><span class="rail-icon">▤</span>日历</div>
        <div class="rail-item"><span class="rail-icon">◆</span>任务</div>
        <div class="rail-item"><span class="rail-icon">▦</span>多维表格</div>
        <div class="rail-item"><span class="rail-icon">♟</span>联系人</div>
        <div class="rail-item"><span class="rail-icon">▧</span>云文档</div>
        <div class="rail-item"><span class="rail-icon">★</span>收藏</div>
        <div class="rail-item"><span class="rail-icon">▥</span>知识库</div>
        <div class="rail-item"><span class="rail-icon">◉</span>服务台</div>
        <div class="rail-item"><span class="rail-icon">◈</span>妙记</div>
      </div>
      <div class="rail-bottom"><div class="rail-item selected"><span class="rail-icon">✔</span>审批</div><div class="rail-item"><span class="rail-icon">✦</span>豆包工作伙伴</div></div>
    </aside>
    <header class="topbar"><div class="tabs"><span class="tab">发起申请</span><span class="tab active">审批中心</span><span class="tab">效率诊断</span><span class="tab">数据管理</span></div><div class="top-tools"><span>☷ 管理后台</span><i>⟳</i><i>⚙</i><i>▣</i></div></header>
    <nav class="sidebar" aria-label="审批中心导航">
      <div class="side-search"><span>⌕ 搜索</span>☰</div>
      <div class="side-scroll">
        <div class="nav-heading"><span>⌄</span><span>▣</span><strong>待办</strong><span class="count">48</span></div>
        <div class="nav-row child">EHR飞书待办<span class="count">40</span></div>
        <div class="oa-group">
          <div class="nav-row child">OA审批<span class="count">8</span></div>
          <div class="nav-row grandchild current" aria-current="page">HRONE待办</div>
        </div>
        <button class="nav-row section section-toggle" id="doneToggle" type="button" aria-expanded="false" aria-controls="donePages"><span class="chevron">▸</span><span>☑</span>已办</button>
        <div class="section-pages" id="donePages" hidden>
          <div class="nav-row">EHR 飞书待办</div>
          <div class="nav-row">法务系统审批</div>
          <div class="nav-row">OA审批</div>
          <div class="nav-row">HRONE待办</div>
        </div>
        <div class="nav-row section"><span>▸</span><span>▤</span>抄送我<span class="count">99+</span></div>
        <button class="nav-row section section-toggle" id="startedToggle" type="button" aria-expanded="false" aria-controls="startedPages"><span class="chevron">▸</span><span>▣</span>已发起</button>
        <div class="section-pages" id="startedPages" hidden>
          <div class="nav-row">会议室申请</div>
          <div class="nav-row">企业自建应用发布申请</div>
          <div class="nav-row">服务台向用户推送消息...</div>
          <div class="nav-row">EHR飞书待办</div>
          <div class="nav-row">OA审批</div>
          <div class="nav-row">HRPNE审批</div>
        </div>
      </div>
      <div class="side-footer">☷ 收起导航</div>
    </nav>
    <section class="list-pane" aria-label="待办列表">
      <div class="list-head"><span>所有时间⌄</span><span>☷</span></div>
      <div class="cards">
        <button class="task-card selected" type="button"><div class="card-title">请审批：{发起人} 提交的 {流程标题}</div><div class="card-bottom"><span class="originator">流程发起人：xxx</span><span class="due muted">◷ │ 21 小时前到达</span></div></button>
        <button class="task-card" type="button"><div class="card-title">请审批：{发起人} 提交的 {流程标题}</div><div class="card-bottom"><span class="originator">流程发起人：xxx</span><span class="due">◷ │ 1 天前到达</span></div></button>
        <button class="task-card" type="button"><div class="card-title">请审批：{发起人} 提交的 {流程标题}</div><div class="card-bottom"><span class="originator">流程发起人：xxx</span><span class="due">◷ │ 4 天前到达</span></div></button>
        <button class="task-card" type="button"><div class="card-title">请审批：{发起人} 提交的 {流程标题}</div><div class="card-bottom"><span class="originator">流程发起人：xxx</span><span class="due">◷ │ 289 天前到达</span></div></button>
        <button class="task-card" type="button"><div class="card-title">请审批：{发起人} 提交的 {流程标题}</div><div class="card-bottom"><span class="originator">流程发起人：xxx</span><span class="due">◷ │ 289 天前到达</span></div></button>
        <button class="task-card" type="button"><div class="card-title">请审批：{发起人} 提交的 {流程标题}</div><div class="card-bottom"><span class="originator">流程发起人：xxx</span><span class="due">◷ │ 305 天前到达</span></div></button>
      </div>
    </section>
    <section class="detail-wrap" aria-label="待办详情预览"><div class="detail">
      <svg class="empty-art" viewBox="0 0 160 150" role="img" aria-label="浏览器打开提示插画">
        <ellipse cx="80" cy="126" rx="68" ry="13" fill="#eef3fb"/>
        <path d="M46 95c-19 10-25 26-18 35 10 11 89 15 110-3 6-5 5-19-9-27" fill="none" stroke="#2468f6" stroke-width="12" stroke-linecap="round"/>
        <path d="M91 19c12-14 36-12 45 6 4 8 4 20 1 30l-16 1-24-4-17-17z" fill="#123486"/>
        <path d="M89 34c10 11 21 14 37 11v34c0 28-17 42-39 42S48 107 48 79V58c0-11 17-20 41-24z" fill="#f7fbff" stroke="#23457f" stroke-width="2"/>
        <path d="M72 42c-1 13 3 17 10 18m29-14c1 8-2 12-8 13" fill="none" stroke="#23457f" stroke-width="2" stroke-linecap="round"/>
        <rect x="30" y="50" width="72" height="65" rx="6" fill="#dce4ed"/>
        <circle cx="42" cy="60" r="3" fill="#aab8ca"/><circle cx="53" cy="60" r="3" fill="#aab8ca"/>
        <path d="M107 115h27v7h-27z" fill="#00c9b0"/>
      </svg>
      <p class="empty-note">此单据需通过浏览器打开</p>
      <button class="open-button" type="button">此单据需通过浏览器打开</button>
    </div></section>
  </main>
  <script>
    for (const [toggleId, pagesId] of [['doneToggle', 'donePages'], ['startedToggle', 'startedPages']]) {
      const toggle = document.getElementById(toggleId);
      const pages = document.getElementById(pagesId);
      toggle.addEventListener('click', () => {
        const expanded = toggle.getAttribute('aria-expanded') !== 'true';
        toggle.setAttribute('aria-expanded', String(expanded));
        pages.hidden = !expanded;
        toggle.querySelector('.chevron').textContent = expanded ? '▾' : '▸';
      });
    }
    document.querySelectorAll('.task-card').forEach((card, index) => card.addEventListener('click', () => {
      document.querySelectorAll('.task-card').forEach(item => item.classList.toggle('selected', item === card));
      if (index !== 0) return;
      if (window.parent !== window) window.parent.postMessage({ type:'hrone-open-feishu-todo-detail' }, '*');
      else window.location.href = 'feishu-todo-approval-detail.html';
    }));
  </script>
</body>
</html>
