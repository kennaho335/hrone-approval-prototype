<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>流程配置</title>
  <style>
    :root{--blue:#1677ff;--text:#24324b;--muted:#718096;--line:#e7ebf1;--bg:#f5f7fb}
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{overflow:hidden;color:var(--text);background:var(--bg);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
    button,input,select{font:inherit}.app{height:100%;min-width:900px}.global-header{height:52px;display:flex;align-items:center;background:#fff;border-bottom:1px solid #edf0f5}.logo{width:128px;margin-left:28px;color:#0d4a99;font-size:21px;font-weight:800;letter-spacing:1px}.logo b{color:#ffb000}.home{width:40px;color:#697586;text-align:center;font-size:17px}.all-menu{height:28px;padding:5px 10px;border:1px solid #dfe4ec;border-radius:3px;color:#263445;font-size:12px}.module{align-self:stretch;display:flex;align-items:center;margin-left:18px;padding:0 17px;color:#fff;background:var(--blue);font-size:13px}.header-tools{display:flex;align-items:center;gap:14px;margin-left:auto;padding-right:28px;color:#7d8794}.search{width:202px;padding:8px 13px;border-radius:18px;box-shadow:0 2px 9px rgba(0,0,0,.08);font-size:12px;color:#b1b8c2}.round{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:50%;box-shadow:0 2px 8px rgba(0,0,0,.08)}.count{position:relative}.count:before{content:attr(data-count);position:absolute;top:-10px;right:-11px;min-width:24px;padding:1px 4px;border-radius:10px;color:#fff;background:#ff4d4f;text-align:center;font-size:11px}.user{padding:7px 12px;border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,.08);font-size:12px}
    .sidebar{position:absolute;top:52px;bottom:0;left:0;width:220px;padding-top:7px;background:#fff;border-right:1px solid #edf0f5}.nav{width:100%;height:48px;display:flex;align-items:center;padding:0 28px;border:0;color:#253248;background:#fff;text-align:left;cursor:pointer}.nav .chev{margin-left:auto;font-size:12px}.nav.active{color:var(--blue);background:#eaf2ff;font-weight:600}.nav:hover,.nav:focus-visible{color:var(--blue);outline:none;background:#f0f5ff}
    .workspace{position:absolute;top:52px;left:220px;right:0;bottom:0;min-width:0}.crumb{height:42px;display:flex;align-items:center;gap:28px;margin:0 10px;padding:0 24px;color:#4b5565;background:#f6f8fc;font-size:12px}.crumb .active{align-self:stretch;display:flex;align-items:center;border-bottom:2px solid var(--blue);color:var(--blue)}
    .content{position:absolute;inset:51px 10px 0;display:grid;grid-template-columns:332px minmax(0,1fr);gap:10px;min-height:0}.panel{min-height:0;border:1px solid #ebeff5;border-radius:8px;background:#fff;overflow:hidden}.type-panel{display:flex;flex-direction:column;padding:16px}.type-search{height:31px;width:100%;padding:0 11px;border:1px solid #d9dfe7;border-radius:5px;outline:none;color:var(--text)}.type-search:focus{border-color:#91caff;box-shadow:0 0 0 2px rgba(22,119,255,.12)}.type-tools{display:flex;align-items:center;justify-content:space-between;height:43px;color:#27364a;font-size:12px}.type-tools strong{font-weight:400}.add-type{padding:0;border:0;color:var(--blue);background:transparent;cursor:pointer}.expand-all{border:0;padding:0;color:#8491a1;background:transparent;cursor:pointer}.type-tree{flex:1;overflow:auto;padding-top:2px}.type-row{height:38px;display:flex;align-items:center;gap:10px;padding:0 7px;color:#24324b;cursor:pointer}.type-row:hover{background:#f5f8fd}.type-caret{width:11px;color:#24324b;font-size:12px}.type-children{padding-left:27px}.type-children[hidden]{display:none}
    .main-panel{display:flex;flex-direction:column;min-width:0}.query{flex:0 0 153px;padding:13px 18px 14px;border-bottom:1px solid var(--line)}.query-title{display:flex;align-items:center;gap:6px;height:26px;font-weight:700}.query-title span{font-size:12px}.query-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px 12px;margin-top:8px}.field label{display:block;margin-bottom:6px;color:#526179;font-size:12px}.field input,.field select{width:100%;height:31px;padding:0 10px;border:1px solid #d9dfe7;border-radius:5px;outline:none;color:#516076;background:#fff}.field input:focus,.field select:focus{border-color:#91caff;box-shadow:0 0 0 2px rgba(22,119,255,.12)}.query-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:11px}.query-actions button,.table-head button{height:31px;padding:0 13px;border:1px solid #d9dfe7;border-radius:5px;color:#27364a;background:#fff;cursor:pointer}.query-actions .primary,.table-head .primary{color:#fff;border-color:var(--blue);background:var(--blue)}
    .table-wrap{flex:1;min-height:0;padding:10px;overflow:auto}.table-head{display:flex;justify-content:flex-end;gap:8px;height:38px}.table-head .settings{width:31px;padding:0}.table-scroll{overflow:auto;height:calc(100% - 38px);border-top:1px solid var(--line)}table{width:100%;min-width:1020px;border-collapse:separate;border-spacing:0;table-layout:fixed}th{position:sticky;top:0;z-index:1;height:38px;padding:0 10px;color:#263348;background:#fafbfc;border-bottom:1px solid var(--line);text-align:left;font-size:12px;white-space:nowrap}td{height:43px;padding:0 10px;color:#263348;border-bottom:1px solid #f0f2f5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}tbody tr:hover{background:#f6f9ff}td.name a{color:var(--blue);text-decoration:none}td.status span{display:inline-block;padding:3px 8px;border-radius:12px;font-size:11px}.published{color:#16803c;background:#effaf2}.draft{color:#9b7417;background:#fff6df}.version{display:inline-block;padding:3px 8px;border:1px solid #91caff;border-radius:12px;color:var(--blue);background:#eef6ff;font-size:11px}.row-actions{display:flex;gap:5px}.row-actions button{width:27px;height:27px;padding:0;border:0;border-radius:5px;color:#fff;background:var(--blue);cursor:pointer}.row-actions button:hover{background:#4096ff}.pagination{display:flex;align-items:center;justify-content:flex-end;gap:10px;height:40px;color:#55657d;font-size:12px}.pagination button{width:27px;height:27px;padding:0;border:1px solid #d9dfe7;border-radius:5px;background:#fff;color:#24324b}.pagination button.active{border-color:var(--blue);color:var(--blue);background:#eef6ff}.toast{position:fixed;right:24px;bottom:24px;display:none;padding:10px 14px;border-radius:5px;color:#1f2937;background:#fff;box-shadow:0 5px 18px rgba(0,0,0,.18)}.toast.show{display:block}
    @media(max-width:1280px){.header-tools{gap:8px;padding-right:16px}.search{width:150px}.user{display:none}.query-grid{grid-template-columns:1fr 1fr 1fr}.content{grid-template-columns:290px minmax(0,1fr)}}@media(max-width:960px){.sidebar{width:160px}.workspace{left:160px}.logo{width:112px;margin-left:18px}.all-menu{display:none}.module{margin-left:4px}.home{width:32px}.search{display:none}.content{grid-template-columns:240px minmax(0,1fr);gap:8px}.type-panel{padding:10px}.query{padding-left:12px;padding-right:12px}}
  </style>
</head>
<body>
  <div class="app">
    <header class="global-header"><div class="logo">HR<b>O</b>NE</div><div class="home">⌂</div><div class="all-menu">👥 全部菜单　⌄</div><div class="module">流程管理 ×</div><div class="header-tools"><div class="search">快捷菜单搜索　　⌕</div><div class="round">◎</div><div class="round count" data-count="512">✉</div><div class="round count" data-count="194">♟</div><div class="user">◉ 雷佳俊</div></div></header>
    <aside class="sidebar"><button class="nav" id="flowQueryNav">♧　流程查询 <span class="chev">⌄</span></button><button class="nav active" id="processConfigNav">▥　流程配置</button></aside>
    <main class="workspace"><nav class="crumb"><span>首页</span><span class="active">流程配置</span></nav><section class="content">
      <aside class="panel type-panel"><input class="type-search" id="typeSearch" placeholder="⌕ 请输入关键字查找" aria-label="流程类型搜索"><div class="type-tools"><span><strong>流程类型</strong>　<button class="add-type" id="addType">＋ 新增</button></span><button class="expand-all" id="expandAll">⌄ 展开下级</button></div><div class="type-tree" id="typeTree"><div class="type-row"><span class="type-caret">›</span><span>招聘</span></div><div class="type-row"><span class="type-caret">›</span><span>组织</span></div><div class="type-row"><span class="type-caret">›</span><span>人事</span></div><div class="type-row"><span class="type-caret">›</span><span>考勤</span></div><div class="type-row"><span class="type-caret">›</span><span>绩效</span></div><div class="type-row"><span class="type-caret">›</span><span>薪酬</span></div></div></aside>
      <section class="panel main-panel"><div class="query"><div class="query-title">▽ <span>查询条件</span></div><div class="query-grid"><div class="field"><label for="processCode">流程标识</label><input id="processCode" placeholder="请输入"></div><div class="field"><label for="processName">流程名称</label><input id="processName" placeholder="请输入"></div><div class="field"><label for="versionStatus">版本状态</label><select id="versionStatus"><option value="">请选择</option><option>发布</option><option>草稿</option></select></div></div><div class="query-actions"><button id="resetButton">↻ 重置</button><button class="primary" id="searchButton">⌕ 查询</button></div></div><div class="table-wrap"><div class="table-head"><button class="primary" id="newProcess">＋ 新增</button><button class="settings" aria-label="列表设置">⚙</button></div><div class="table-scroll"><table><thead><tr><th style="width:48px">序号</th><th style="width:190px">流程名称</th><th style="width:150px">流程标识</th><th style="width:100px">流程类型</th><th style="width:130px">最近发起日期</th><th style="width:100px">版本状态</th><th style="width:90px">流程版本</th><th style="width:150px">描述</th><th style="width:100px">流程来源</th><th style="width:108px">操作</th></tr></thead><tbody id="processRows"></tbody></table></div><div class="pagination"><span>共46条数据</span><button>‹</button><button class="active">1</button><button>2</button><button>3</button><button>›</button><span>20条/页</span><span>跳至</span><input id="pageInput" style="width:42px;height:27px;border:1px solid #d9dfe7;border-radius:4px" aria-label="跳转页码"> <span>页</span></div></div></section>
    </section></main>
  </div><div class="toast" id="toast" role="status"></div>
  <script>
    const rows=[
      ['HDS测试补签流程','Proc000058','考勤','2026/10/21','发布','v1','第一版测试DEMO','自定义'],['离职流程','Proc000002','人事','2026/10/20','发布','v43','离职流程','自定义'],['转正流程','Proc000001','人事','2026/10/20','发布','v79','转正流程','自定义'],['333','s_Proc000054','组织','--','草稿','v2','--','自定义'],['调动流程','Proc000003','人事','2026/10/20','发布','v108','调动流程','自定义'],['ZT晋升见习转正','Proc000047','人事','2026/10/20','发布','v10','--','自定义'],['公出流程1','Proc000057','考勤','--','草稿','v1','--','自定义'],['合同变更流程','Proc000032','人事','2026/07/29','发布','v3','合同变更流程','系统默认'],['结果确认流程','Proc000030','结果确认','--','发布','v3','--','自定义'],['目标制定-线上导入审批通用流程','Proc000024','目标制定','--','发布','v3','--','自定义']
    ];
    const tbody=document.getElementById('processRows');const toast=document.getElementById('toast');const message=text=>{toast.textContent=text;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800)};
    const render=data=>{tbody.replaceChildren();data.forEach((row,index)=>{const tr=document.createElement('tr');tr.innerHTML=`<td>${index+1}</td><td class="name"><a href="#">${row[0]}</a></td><td>${row[1]}</td><td>${row[2]}</td><td>${row[3]}</td><td class="status"><span class="${row[4]==='发布'?'published':'draft'}">${row[4]}</span></td><td><span class="version">${row[5]}</span></td><td>${row[6]}</td><td>${row[7]}</td><td><div class="row-actions"><button aria-label="编辑">✎</button><button aria-label="复制">⧉</button><button aria-label="更多">•••</button></div></td>`;tr.querySelector('.name a').addEventListener('click',e=>{e.preventDefault();message(`已打开“${row[0]}”流程`) });tr.querySelectorAll('.row-actions button').forEach(btn=>btn.addEventListener('click',()=>message(`${btn.getAttribute('aria-label')}操作：${row[0]}`)));tbody.appendChild(tr)})};
    render(rows);document.getElementById('searchButton').addEventListener('click',()=>{const code=document.getElementById('processCode').value.trim().toLowerCase(),name=document.getElementById('processName').value.trim().toLowerCase(),status=document.getElementById('versionStatus').value;render(rows.filter(r=>(!code||r[1].toLowerCase().includes(code))&&(!name||r[0].toLowerCase().includes(name))&&(!status||r[4]===status)))});document.getElementById('resetButton').addEventListener('click',()=>{document.getElementById('processCode').value='';document.getElementById('processName').value='';document.getElementById('versionStatus').value='';render(rows)});document.getElementById('newProcess').addEventListener('click',()=>message('已打开新建流程'));document.getElementById('addType').addEventListener('click',()=>message('已打开新增流程类型'));document.getElementById('expandAll').addEventListener('click',()=>message('流程类型下级已展开'));document.getElementById('typeSearch').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();document.querySelectorAll('.type-row').forEach(row=>row.hidden=q&&!row.textContent.toLowerCase().includes(q))});document.getElementById('flowQueryNav').addEventListener('click',()=>{if(window.parent!==window)window.parent.postMessage({type:'hrone-open-all-processes'},'*');else location.href='all-processes.html'});
  </script>
</body>
</html>
